name: Stack qualification

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.7"
  UV_VERSION: "0.12.17"
  PNPM_VERSION: "12.4.1"
  NODE_VERSION: "22"
  DUCKDB_VERSION: "1.5.5"
  DUCKLAKE_SHA256: "4546a5c6d9bc52cc122bc76e521c996e1ac31e71a25e01c531db8d3bb65e2ef0"

jobs:
  source-quality:
    name: Linux source and frozen-lock checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install exact Python
        run: uv python install "$PYTHON_VERSION"

      - name: Sync frozen Python dependencies
        run: uv sync --frozen --extra dev --python "$PYTHON_VERSION"

      - name: Python quality and tests
        run: |
          uv run --frozen ruff format --check src tests scripts packaging/windows
          uv run --frozen ruff check src tests scripts packaging/windows
          uv run --frozen pyright
          uv run --frozen pytest

      - name: Exercise native analytical stack
        run: uv run --frozen python scripts/probe_native_stack.py --evidence qualification-evidence/native-stack-linux.json

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Sync frozen frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend quality and build
        run: |
          pnpm check:web
          pnpm typecheck:web
          pnpm test:web
          pnpm build:web

      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-qualification-evidence
          path: qualification-evidence/
          if-no-files-found: warn

  windows-portable:
    name: Windows x64 embedded-CPython portable stack
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install exact Python and frozen dependencies
        shell: pwsh
        run: |
          uv python install $env:PYTHON_VERSION
          uv sync --frozen --extra dev --python $env:PYTHON_VERSION

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Sync frozen frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source layers on Windows
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --frozen ruff format --check src tests scripts packaging/windows
          uv run --frozen ruff check src tests scripts packaging/windows
          uv run --frozen pyright
          uv run --frozen pytest
          pnpm check:web
          pnpm typecheck:web
          pnpm test:web
          pnpm build:web

      - name: Stage pinned DuckLake and prove local compatibility
        shell: pwsh
        run: |
          ./scripts/stage_ducklake.ps1 -DuckDBVersion $env:DUCKDB_VERSION -Platform windows_amd64
          uv run --frozen python scripts/verify_ducklake.py `
            --extension packaging/duckdb_extensions/ducklake.duckdb_extension `
            --expected-duckdb $env:DUCKDB_VERSION `
            --expected-sha256 $env:DUCKLAKE_SHA256 `
            --evidence qualification-evidence/ducklake-windows.json

      - name: Exercise Windows native analytical stack
        shell: pwsh
        run: uv run --frozen python scripts/probe_native_stack.py --evidence qualification-evidence/native-stack-windows.json

      - name: Build embedded CPython release from frozen inputs
        shell: pwsh
        run: ./scripts/build_portable.ps1 -UseStagedDuckLake

      - name: Expand the exact portable release ZIP
        shell: pwsh
        run: |
          $Archives = @(Get-ChildItem dist/WFMHub-2-v*-windows-x64-portable.zip -File)
          if ($Archives.Count -ne 1) {
            throw "Expected exactly one portable release ZIP, found $($Archives.Count)"
          }
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "WFMHub 2 portable ü release"
          if (Test-Path -LiteralPath $ExtractRoot) {
            Remove-Item -LiteralPath $ExtractRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $Archives[0].FullName -DestinationPath $ExtractRoot

      - name: Run the full doctor with the exact embedded Python
        shell: pwsh
        run: |
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "WFMHub 2 portable ü release"
          $PortableRoot = Join-Path $ExtractRoot "WFMHub-2"
          $PythonPath = Join-Path $PortableRoot "_system/runtime/python.exe"
          $ExtensionPath = Join-Path $PortableRoot "_system/duckdb_extensions/ducklake.duckdb_extension"
          $DoctorOutput = & $PythonPath -I -m wfmhub2.portable_doctor `
            --home $PortableRoot `
            --ducklake-extension $ExtensionPath `
            --full --require-offline --json
          if ($LASTEXITCODE -ne 0) {
            throw "The exact embedded Python failed its full offline doctor."
          }
          New-Item -ItemType Directory -Force qualification-evidence | Out-Null
          $DoctorOutput | Set-Content qualification-evidence/embedded-doctor.json -Encoding utf8
          $DoctorOutput | Write-Host

      - name: Smoke localhost health, storage, and React with outbound blocked
        if: ${{ always() && hashFiles('dist/WFMHub-2-v*-windows-x64-portable.zip') != '' && hashFiles('dist/WFMHub-2-v*-windows-x64-portable.zip.sha256') != '' }}
        shell: pwsh
        run: |
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "WFMHub 2 portable ü release"
          $PortableRoot = Join-Path $ExtractRoot "WFMHub-2"
          ./scripts/smoke_embedded_portable.ps1 `
            -PortableRoot $PortableRoot `
            -TimeoutSeconds 120 `
            -EvidencePath qualification-evidence/embedded-portable-smoke.json `
            -BlockOutbound

      - name: Record package-size and checksum evidence
        if: ${{ always() && hashFiles('dist/WFMHub-2-v*-windows-x64-portable.zip') != '' && hashFiles('dist/WFMHub-2-v*-windows-x64-portable.zip.sha256') != '' }}
        shell: pwsh
        run: |
          $Files = @()
          $Candidates = @(
            "packaging/duckdb_extensions/ducklake.duckdb_extension",
            "build/embedded-portable/WFMHub-2/_system/runtime/python.exe",
            "build/embedded-portable/WFMHub-2/_system/manifests/NATIVE_FILES.sha256",
            "build/embedded-portable/WFMHub-2/_system/manifests/RUNTIME_ORIGIN.json"
          )
          $Candidates += Get-ChildItem dist/WFMHub-2-v*-windows-x64-portable.zip* -File |
            Select-Object -ExpandProperty FullName
          foreach ($Candidate in $Candidates) {
            if (Test-Path $Candidate -PathType Leaf) {
              $Item = Get-Item $Candidate
              $Files += [ordered]@{
                path = $Item.FullName
                bytes = $Item.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -Path $Item.FullName).Hash.ToLowerInvariant()
              }
            }
          }
          New-Item -ItemType Directory -Force qualification-evidence | Out-Null
          $Files | ConvertTo-Json | Set-Content qualification-evidence/package-files.json -Encoding utf8
          $Files | Format-Table path, bytes | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload portable release ZIP
        if: ${{ always() && hashFiles('dist/WFMHub-2-v*-windows-x64-portable.zip') != '' && hashFiles('dist/WFMHub-2-v*-windows-x64-portable.zip.sha256') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WFMHub-2-windows-x64-portable
          path: |
            dist/WFMHub-2-v*-windows-x64-portable.zip
            dist/WFMHub-2-v*-windows-x64-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stack-qualification-evidence
          path: |
            qualification-evidence/
            packaging/duckdb_extensions/ducklake.manifest.json
          if-no-files-found: warn

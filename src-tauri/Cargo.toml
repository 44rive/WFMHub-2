[package]
name = "wfmhub-2"
version = "0.2.0"
description = "WFMHub 2 desktop shell"
authors = ["WFMHub contributors"]
edition = "2021"

[lib]
name = "wfmhub_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

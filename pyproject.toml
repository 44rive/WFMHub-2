[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wfmhub2"
version = "0.2.0"
description = "Portable workforce intelligence and decision platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb>=1.5.5,<2.0",
  "polars>=1.44.2,<2.0",
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.35,<1.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "ortools>=9.15.6755,<10.0",
  "statsforecast>=2.1.1,<3.0",
  "mlforecast>=1.1.0,<2.0",
  "hierarchicalforecast>=1.5.1,<2.0",
  "xgboost>=3.4.1,<4.0",
  "openpyxl>=3.1,<4.0",
  "XlsxWriter>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "hypothesis>=6.138,<7.0",
  "ruff>=0.16,<1.0",
  "pyright>=1.1,<2.0",
  "httpx2>=2.13,<3.0",
]

[project.scripts]
wfmhub2 = "wfmhub2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wfmhub2"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
